<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer Shield Badge -->
  <path d="M256 64 L384 120 V248 C384 340 326 414 256 448 C186 414 128 340 128 248 V120 Z" 
        fill="url(#shieldGrad)" 
        stroke="rgba(255,255,255,0.15)" 
        stroke-width="6"/>

  <!-- Glowing Emblem Core -->
  <path d="M256 100 L352 142 V244 C352 316 308 376 256 404 C204 376 160 316 160 244 V142 Z" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="12" 
        filter="url(#glow)"/>
        
  <!-- Center Microchip / Lock Nodes -->
  <circle cx="256" cy="236" r="28" fill="#10b981"/>
  <circle cx="256" cy="236" r="16" fill="#09090b"/>
  <path d="M256 264 V310 M256 162 V208 M192 236 H228 M284 236 H320" 
        stroke="#10b981" 
        stroke-width="8" 
        stroke-linecap="round"/>
</svg>
